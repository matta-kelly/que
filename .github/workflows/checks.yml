# The checks every pull request must pass, and that main is held to.
# The same steps as `just check`, without the dev container.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Which app a change touches. A path outside both apps can affect either, so it counts for both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.paths.outputs.server }}
      ui: ${{ steps.paths.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge commit: the first parent is main.
          fetch-depth: 2
      - id: paths
        run: |
          server=false
          ui=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            paths=$(git diff --name-only HEAD^1 HEAD)
            while read -r path; do
              case "$path" in
                "") ;;
                server/*) server=true ;;
                ui/*) ui=true ;;
                *) server=true; ui=true ;;
              esac
            done <<< "$paths"
          else
            server=true
            ui=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          # Without ui/ on disk, a pass proves the server stands alone.
          sparse-checkout: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: types (contract, backend, harness, evals, tests)
        run: npx tsc --noEmit
        working-directory: server/harness
      - name: lint
        run: npx eslint
      - name: format
        run: npx prettier --check .
      - name: unit and integration tests
        run: npx tsx --test "contract/**/*.test.ts" "backend/**/*.test.ts" "harness/src/**/*.test.ts" "evals/**/*.test.ts" "tests/integration/**/*.test.ts"

  ui:
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          # Without server/ on disk, a pass proves the UI stands alone.
          sparse-checkout: ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: types
        run: npx tsc --noEmit
      - name: lint
        run: npx eslint
      - name: format
        run: npx prettier --check .

  # The one name the ruleset on main requires, whichever apps ran.
  checks:
    needs: [changes, server, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SERVER: ${{ needs.server.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "changes=$CHANGES server=$SERVER ui=$UI"
          # A failed `changes` skips both apps, which must not read as a pass.
          [ "$CHANGES" = success ] || exit 1
          for result in "$SERVER" "$UI"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
