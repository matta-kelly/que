# The checks main is held to, after each push: the backstop behind the pre-push hook (.githooks/pre-push), which runs the same set.
# The check set is in `scripts/check.sh`, which `just check` runs too: this file sets up the toolchain and calls it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. A run on main is never cancelled.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which sets the change needs. The script decides, as it does on a machine.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.plan.outputs.server }}
      ui: ${{ steps.plan.outputs.ui }}
      shell: ${{ steps.plan.outputs.shell }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request is checked out as its merge commit, whose first parent is main.
          # On main, the first parent is the commit before the merge.
          fetch-depth: 2
      - id: plan
        env:
          CHECK_BASE: HEAD^1
        run: |
          scripts/check.sh --plan >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Without ui/ on disk, a pass proves the server stands alone.
          sparse-checkout: |
            scripts
            server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: scripts/check.sh server

  ui:
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Without server/ on disk, a pass proves the UI stands alone.
          sparse-checkout: |
            scripts
            ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: scripts/check.sh ui

  shell:
    needs: [changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scripts, the justfile at the root, and the file that reads the justfile's recipes, are all the set reads.
          sparse-checkout: |
            scripts
            server/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: scripts/check.sh shell

  notes:
    needs: [changes]
    if: needs.changes.outputs.notes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole repo: the notes are everywhere in it, and the lint reads them from its root.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: scripts/check.sh notes

  # The one result of a run. It always starts, so it is never left pending:
  # a set's job that the change did not need is skipped, and a skipped job passes here.
  checks:
    needs: [changes, server, ui, shell, notes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SERVER: ${{ needs.server.result }}
          UI: ${{ needs.ui.result }}
          SHELL_SET: ${{ needs.shell.result }}
          NOTES: ${{ needs.notes.result }}
        run: |
          echo "changes=$CHANGES server=$SERVER ui=$UI shell=$SHELL_SET notes=$NOTES"
          # A failed `changes` skips every set, which must not read as a pass.
          [ "$CHANGES" = success ] || exit 1
          for result in "$SERVER" "$UI" "$SHELL_SET" "$NOTES"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
