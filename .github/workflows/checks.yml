# The checks every push runs, to every branch, main included, behind the pre-push hook (.githooks/pre-push), which runs
# the same set. The ruleset on main requires the job `checks` on the exact commit, so the trigger has no path filter (a
# required check that a path filter skips stays pending): the script skips what a change does not need.
# The check set is in `scripts/check.sh`, which `just check` runs too: the jobs run in the dev image that `changes`
# resolves for the commit, by digest, and call it.
name: checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a newer push to a branch cancels the older run. On main a running run is not cancelled, but GitHub
# keeps one waiting run per group, so a newer push replaces a waiting one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which sets the change needs. The script decides, as it does on a machine.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job that writes to the registry, with the run's own token, never printed.
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.plan.outputs.server }}
      ui: ${{ steps.plan.outputs.ui }}
      shell: ${{ steps.plan.outputs.shell }}
      notes: ${{ steps.plan.outputs.notes }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # All history, so origin/main is there.
          fetch-depth: 0
      - id: plan
        env:
          # A branch is measured from where it left main, so the sets cover each commit on it, not only the last.
          # On main, origin/main is the commit itself, so main is measured from the commit before it.
          CHECK_BASE: ${{ github.ref == 'refs/heads/main' && 'HEAD^1' || 'origin/main' }}
        run: |
          scripts/check.sh --plan >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      # Built here when ghcr lacks this commit's image, so every run is on the image of its own inputs.
      - id: image
        run: |
          image=$(scripts/dev-image.sh ensure)
          echo "image=$image" >> "$GITHUB_OUTPUT"

  server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: 'echo "dev image: ${{ needs.changes.outputs.image }}"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The folders the server set reads: the check script, the server, the template deployment, which a test mounts,
          # and the workflows, since a test reads the pair's release in publish.yml.
          # The files at the repo's root come too, as they do in every sparse checkout in cone mode: a test reads README.md, and a pack copies LICENSE.
          # Without ui/ on disk, a pass proves the server stands alone.
          sparse-checkout: |
            .github
            scripts
            server
            templates
      - run: scripts/check.sh server

  ui:
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: 'echo "dev image: ${{ needs.changes.outputs.image }}"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Without server/ on disk, a pass proves the UI stands alone.
          sparse-checkout: |
            scripts
            ui
      - run: scripts/check.sh ui

  shell:
    needs: [changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: 'echo "dev image: ${{ needs.changes.outputs.image }}"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scripts, the justfile at the root, and the file that reads the justfile's recipes, are all the set reads;
          # .github too, since the dev image's tests read its workflow.
          sparse-checkout: |
            scripts
            server/scripts
            .github
      - run: scripts/check.sh shell

  notes:
    needs: [changes]
    if: needs.changes.outputs.notes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: 'echo "dev image: ${{ needs.changes.outputs.image }}"'
      # The whole repo: the notes are everywhere in it, and the lint reads them from its root.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check.sh notes

  # The one result of a run. It always starts, so it is never left pending:
  # a set's job that the change did not need is skipped, and a skipped job passes here.
  checks:
    needs: [changes, server, ui, shell, notes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SERVER: ${{ needs.server.result }}
          UI: ${{ needs.ui.result }}
          SHELL_SET: ${{ needs.shell.result }}
          NOTES: ${{ needs.notes.result }}
        run: |
          echo "changes=$CHANGES server=$SERVER ui=$UI shell=$SHELL_SET notes=$NOTES"
          # A failed `changes` skips every set, which must not read as a pass.
          [ "$CHANGES" = success ] || exit 1
          for result in "$SERVER" "$UI" "$SHELL_SET" "$NOTES"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
