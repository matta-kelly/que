# Publishes a package of que's on npm when a version tag of it is pushed: @mku1tra/que-plugin by a `que-plugin-v*` tag,
# @mku1tra/que-harness by a `que-harness-v*` tag. The server set first, then `npm publish` by trusted publishing (OIDC),
# with no token and with provenance. The tag is the gate: a ruleset lets only an admin of the repo make such a tag.
# npmjs.com holds the other half: each package's Trusted Publisher names this repo and this file.
name: publish

on:
  push:
    tags: ["que-plugin-v*", "que-harness-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      # The tag names the package, que-<folder>-v<version>: its folder in server/ and the version in its package.json.
      - name: The tag is the package's version
        run: |
          folder=${GITHUB_REF_NAME#que-}
          folder=${folder%%-v*}
          echo "FOLDER=server/$folder" >>"$GITHUB_ENV"
          test "que-$folder-v$(node -p "require('./server/$folder/package.json').version")" = "$GITHUB_REF_NAME"
      - run: scripts/check.sh server
      # A version npm has already is left as it is: a run again, or the first version, published by hand.
      - name: Publish, if npm does not have this version
        working-directory: ${{ env.FOLDER }}
        run: |
          package=$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')
          if npm view "$package" version >/dev/null 2>&1; then
            echo "npm has $package already"
          else
            npm publish
          fi
