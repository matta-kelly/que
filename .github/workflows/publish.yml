# Publishes the pair, @mku1tra/que-plugin and @mku1tra/que-harness, on npm when a `que-pair-*` tag is pushed: one tag,
# one job. The server set first, then the guard of the pair's release (server/scripts/pair-release-live.ts), which reads
# npm's live records and names which of the pair to publish, or refuses the release. Then `npm publish` of what the guard
# names, plugin before harness, by trusted publishing (OIDC), with no token and with provenance. Only the guard decides:
# a version npm has already is never a pass on its own. The tag is the gate: a ruleset lets only an admin of the repo
# make such a tag. npmjs.com holds the other half: each package's Trusted Publisher names this repo and this file.
name: publish

on:
  push:
    tags: ["que-pair-*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      - run: scripts/check.sh server
      # Writes plugin=true|false and harness=true|false, and each one's dist-tag (plugin_tag, harness_tag), or refuses and
      # stops the job. A prerelease never takes latest: npm 11 refuses a prerelease with no --tag.
      - id: guard
        name: The guard of the pair's release, on npm's records
        working-directory: server
        run: npx tsx scripts/pair-release-live.ts
      - id: plugin
        name: Publish @mku1tra/que-plugin
        if: steps.guard.outputs.plugin == 'true'
        working-directory: server/plugin
        run: npm publish --tag ${{ steps.guard.outputs.plugin_tag }}
      - id: harness
        name: Publish @mku1tra/que-harness
        if: steps.guard.outputs.harness == 'true'
        working-directory: server/harness
        run: npm publish --tag ${{ steps.guard.outputs.harness_tag }}
      # A partial publish: plugin is on npm and harness is not. A run again of the tag's run publishes harness alone.
      - name: A partial publish
        if: failure() && steps.plugin.outcome == 'success'
        run: |
          echo "::error::npm holds @mku1tra/que-plugin alone: run the tag's run again, which publishes @mku1tra/que-harness"
          exit 1
