# The podman settings of the dev container CLI's calls, and only theirs: scripts/container.sh sets
# CONTAINERS_CONF_OVERRIDE on that one call. A container's settings are not here; they are in
# .devcontainer/devcontainer.json.
#
# The CLI starts `podman events` and `podman run` together, and waits for the container's start event
# forever (startEventSeen in its src/spec-node/utils.ts). On the journald backend, `podman events` first
# reads back through the journal to its last match, which takes 1 to 2 seconds when those pages are not
# cached, and whatever was written meanwhile it takes as past. The container starts in under a second, so
# its event is lost and the CLI never answers. The file backend seeks to the end of one small file.
# See https://github.com/devcontainers/cli/issues/1236 and
# https://github.com/microsoft/vscode-remote-release/issues/7980.
[engine]
events_logger = "file"
